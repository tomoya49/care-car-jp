<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ステップ2：動かす</title>
  <style>
    body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    canvas { background: #fff; width: 100%; max-width: 640px; height: auto; }
  </style>
</head>
<body>
  <canvas id="screen" width="640" height="360"></canvas>

  <script>
    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d");

    // ★ アニメの正体は「パラパラ漫画」
    //   「消す → 少しずらして描く」を 1秒に約60回 くり返すと、動いて見える。

    let x = -60; // キャラの横位置（画面の左の外からスタート）

    function frame() {
      // ① 前の絵を消す（＝背景で塗りつぶす）
      ctx.fillStyle = "#8fd3ff";
      ctx.fillRect(0, 0, 640, 360);
      ctx.fillStyle = "#6cc56c";
      ctx.fillRect(0, 290, 640, 70);

      // ② 位置を少しだけ右にずらす
      x = x + 2;
      if (x > 700) x = -60; // 右の外に出たら、左に戻る

      // ③ ぴょこぴょこ跳ねさせる：Math.sin は -1〜1 を行ったり来たりする波
      const hop = Math.abs(Math.sin(x / 15)) * 15;

      // ④ 新しい位置にキャラを描く
      drawCharacter(x, 290 - hop);

      // ⑤ 「次の1コマもお願い」とブラウザに頼む → これでずっとくり返される
      requestAnimationFrame(frame);
    }

    frame(); // アニメ開始！

    function drawCharacter(x, y) {
      ctx.fillStyle = "#ffcc66";
      ctx.beginPath();
      ctx.arc(x, y - 50, 50, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(x - 18, y - 60, 6, 0, Math.PI * 2);
      ctx.arc(x + 18, y - 60, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y - 45, 12, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();
    }
  </script>
</body>
</html>
