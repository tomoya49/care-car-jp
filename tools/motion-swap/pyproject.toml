[project]
name = "motion-swap"
version = "0.1.0"
description = "動画の人物の動きはそのままに、顔・体つきを同意済みの別人物へ置き換えるツール（Wan2.2-Animate を利用）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
motion-swap = "motion_swap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["motion_swap"]
